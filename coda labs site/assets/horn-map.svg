<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none" aria-hidden="true">
  <rect width="400" height="320" fill="#0c1e32" rx="8"/>
  <!-- Simplified Horn of Africa coastline -->
  <path d="M60 280 L80 200 L120 160 L140 120 L160 100 L180 80 L200 70 L220 65 L240 60 L260 55 L280 50 L300 48 L320 50 L340 60 L360 80 L370 100 L375 130 L370 160 L360 190 L340 220 L300 250 L260 270 L200 285 L140 290 L80 288 Z"
        fill="rgba(43,108,176,0.25)" stroke="rgba(99,179,237,0.6)" stroke-width="1.5"/>
  <!-- Djibouti highlight -->
  <circle cx="295" cy="95" r="6" fill="#48bb78" opacity="0.9"/>
  <circle cx="295" cy="95" r="12" fill="none" stroke="#48bb78" stroke-width="1" opacity="0.4"/>
  <!-- Somaliland region -->
  <circle cx="310" cy="75" r="5" fill="#63b3ed" opacity="0.8"/>
  <!-- Grid lines -->
  <line x1="0" y1="160" x2="400" y2="160" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="320" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <!-- Labels -->
  <text x="295" y="118" fill="rgba(255,255,255,0.7)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Djibouti</text>
  <text x="310" y="62" fill="rgba(255,255,255,0.55)" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Somaliland</text>
  <text x="200" y="305" fill="rgba(255,255,255,0.35)" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" letter-spacing="0.08em">HORN OF AFRICA</text>
  <!-- Waveform accent -->
  <path d="M40 240 Q60 230 80 240 T120 240 T160 240 T200 240 T240 240 T280 240 T320 240 T360 240"
        stroke="rgba(99,179,237,0.3)" stroke-width="1.5" fill="none"/>
</svg>